<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Radar rings -->
  <circle cx="600" cy="240" r="24" fill="#10B981"/>
  <circle cx="600" cy="240" r="70" fill="none" stroke="#10B981" stroke-width="3" opacity="0.7"/>
  <circle cx="600" cy="240" r="120" fill="none" stroke="#10B981" stroke-width="2" opacity="0.45"/>
  <circle cx="600" cy="240" r="170" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.25"/>

  <!-- Radar beam -->
  <path d="M 600 240 L 720 140" stroke="#34D399" stroke-width="4" opacity="0.8"/>
  <circle cx="720" cy="140" r="9" fill="#34D399"/>

  <!-- Text -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Radar<tspan fill="#10B981">Cart</tspan></text>
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="30" fill="#A1A1AA" text-anchor="middle">Professional Millimeter Wave Radar Sensors</text>
  <text x="600" y="555" font-family="Arial, sans-serif" font-size="22" fill="#10B981" text-anchor="middle">Traffic • Agriculture • Security • Automotive • Industrial</text>
</svg>
