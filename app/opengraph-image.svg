<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1E3A8A"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Radar waves -->
  <circle cx="600" cy="250" r="60" fill="#60A5FA" opacity="0.3"/>
  <circle cx="600" cy="250" r="100" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.4"/>
  <circle cx="600" cy="250" r="140" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.3"/>
  <circle cx="600" cy="250" r="180" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.2"/>

  <!-- Radar beam -->
  <path d="M 600 250 L 700 150" stroke="#3B82F6" stroke-width="3" opacity="0.6"/>
  <circle cx="700" cy="150" r="8" fill="#60A5FA"/>

  <!-- Text -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RadarWorld</text>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="32" fill="#93C5FD" text-anchor="middle">Commercial &amp; Industrial Radar Systems</text>
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="24" fill="#60A5FA" text-anchor="middle">Advanced Detection Technology • Worldwide Solutions</text>
</svg>
