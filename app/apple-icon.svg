<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="#1E3A8A" rx="40"/>

  <!-- Radar waves -->
  <circle cx="90" cy="70" r="10" fill="#60A5FA" opacity="0.8"/>
  <circle cx="90" cy="70" r="20" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.6"/>
  <circle cx="90" cy="70" r="30" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.4"/>
  <circle cx="90" cy="70" r="40" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.2"/>

  <!-- Wave pattern -->
  <path d="M 50 120 Q 70 100 90 120 T 130 120" fill="none" stroke="#3B82F6" stroke-width="4"/>
  <path d="M 40 135 Q 65 110 90 135 T 140 135" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.7"/>

  <!-- Text -->
  <text x="90" y="165" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RW</text>
</svg>
